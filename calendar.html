    <main class="container">
        <h1>明代年号干支与公历速查换算器</h1>
        <div class="intro-box">
            族人在考订古旧谱牒、墓志铭、神道碑时，常遇“洪武八年乙卯”、“万历四十三年乙卯”等干支年号。本工具可快速完成公历与明代纪年之间的互查。
        </div>

        <div class="calc-box">
            <h2>📜 年号转公历查询</h2>
            <div class="form-row">
                <select id="eraSelect" class="calc-select">
                    <option value="1368,31,洪武">洪武 (明太祖 1368-1398)</option>
                    <option value="1399,4,建文">建文 (明惠宗 1399-1402)</option>
                    <option value="1403,22,永乐">永乐 (明成祖 1403-1424)</option>
                    <option value="1425,1,洪熙">洪熙 (明仁宗 1425)</option>
                    <option value="1426,10,宣德">宣德 (明宣宗 1426-1435)</option>
                    <option value="1436,14,正统">正统 (明英宗 1436-1449)</option>
                    <option value="1450,7,景泰">景泰 (明代宗 1450-1456)</option>
                    <option value="1457,8,天顺">天顺 (明英宗 1457-1464)</option>
                    <option value="1465,23,成化">成化 (明宪宗 1465-1487)</option>
                    <option value="1488,18,弘治">弘治 (明孝宗 1488-1505)</option>
                    <option value="1506,16,正德">正德 (明武宗 1506-1521)</option>
                    <option value="1522,45,嘉靖">嘉靖 (明世宗 1522-1566)</option>
                    <option value="1567,6,隆庆">隆庆 (明穆宗 1567-1572)</option>
                    <option value="1573,48,万历">万历 (明神宗 1573-1620)</option>
                    <option value="1620,1,泰昌">泰昌 (明光宗 1620)</option>
                    <option value="1621,7,天启">天启 (明熹宗 1621-1627)</option>
                    <option value="1628,17,崇祯">崇祯 (明思宗 1628-1644)</option>
                </select>
                <span>第</span>
                <input type="number" id="eraYear" class="calc-input" value="1" min="1" max="50" style="width: 80px;">
                <span>年</span>
                <button class="calc-btn" onclick="calcEraToAD()">查询公历与干支</button>
            </div>
            <div id="eraResult" class="res-display"></div>
        </div>
    </main>

    <footer class="site-footer">
        <p>大明周藩朱氏宗族文化记录 · 岁在丙午 谨立</p>
    </footer>

    <script>
        const gan = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
        const zhi = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
        const shengxiao = ["鼠", "牛", "虎", "兔", "龙", "蛇", "马", "羊", "猴", "鸡", "狗", "猪"];

        function getGanzhi(year) {
            const g = (year - 4) % 10;
            const z = (year - 4) % 12;
            return gan[g] + zhi[z] + "（" + shengxiao[z] + "年）";
        }

        function calcEraToAD() {
            const raw = document.getElementById('eraSelect').value.split(',');
            const startYear = parseInt(raw[0]);
            const maxYear = parseInt(raw[1]);
            const eraName = raw[2];
            const yearNum = parseInt(document.getElementById('eraYear').value);

            if (yearNum < 1 || yearNum > maxYear) {
                alert(`【${eraName}】年号最多为 ${maxYear} 年，请重新输入！`);
                return;
            }

            const adYear = startYear + yearNum - 1;
            const gz = getGanzhi(adYear);
            const res = document.getElementById('eraResult');
            res.innerHTML = `<strong>查询结果：</strong><br>明朝【${eraName}${yearNum === 1 ? '元' : yearNum}年】 对应 <strong>公元 ${adYear} 年</strong><br>岁次干支：<strong>${gz}</strong>`;
            res.style.display = 'block';
        }

        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('show');
        }
    </script>
