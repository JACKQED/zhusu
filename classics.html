    <main class="container">
        <h1>周藩典籍与科学著述</h1>
        <p style="margin-top: 1rem;">周藩一脉好学博古，崇尚实学。始祖周定王朱橚在开封就藩期间，设圃试验植物，广收天下名方，留下了泽被后世的科学巨著。</p>

        <div class="book-card">
            <div class="book-title">《救荒本草》</div>
            <div><span class="tag">植物学</span><span class="tag">救荒农学</span></div>
            <p style="margin-top: 0.8rem;">
                <strong>主编：</strong> 周定王 朱橚（1406年）<br>
                <strong>价值：</strong> 载录植物414种（新增276种），附精准工细木刻图，详载食用与炮制法，开世界食用植物学之先河。
            </p>
        </div>

        <div class="book-card">
            <div class="book-title">《普济方》</div>
            <div><span class="tag">中医学</span><span class="tag">古代最大方剂书</span></div>
            <p style="margin-top: 0.8rem;">
                <strong>主编：</strong> 周定王 朱橚等编纂（1406年）<br>
                <strong>价值：</strong> 全书168卷，载方61,739首，附图239幅，涵盖内外妇儿各科，是中国古代收方最多之医方巨著。
            </p>
        </div>
    </main>

    <footer class="site-footer">
