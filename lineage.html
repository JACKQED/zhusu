    <main class="container">
        <h1>周藩世系与命名规制</h1>
        <h2>明太祖御赐周王府字辈</h2>
        <div class="poem-box">
            有子同安睦，勤朝在肃恭。<br>
            绍伦敷惠润，昭格广思崇。
        </div>
        <p>自第二世起，名字首字为字辈派字，第二字偏旁严格依“五行相生”（木生火、火生土、土生金、金生水、水生木）循环流转。</p>

        <h2>早期世系参考表</h2>
        <table>
            <tr><th>世次</th><th>辈分字</th><th>五行偏旁</th><th>代表先祖</th></tr>
            <tr><td>始祖</td><td>-</td><td>木</td><td>周定王 朱橚</td></tr>
            <tr><td>第二世</td><td>有</td><td>火</td><td>周宪王 朱有炖、周简王 朱有爝</td></tr>
            <tr><td>第三世</td><td>子</td><td>土</td><td>周靖王 朱子垕、周懿王 朱子埛</td></tr>
            <tr><td>第四世</td><td>同</td><td>金</td><td>周惠王 朱同䥝</td></tr>
            <tr><td>第五世</td><td>安</td><td>水</td><td>周悼王 朱安㴦、周恭王 朱安㶇</td></tr>
        </table>
