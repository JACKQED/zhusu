    <main class="container">
        <h1>历代人物与名人事迹</h1>
        <p style="margin-top: 1rem;">收录周王府历代宗亲、学术名宿以及迁徙各地之朱氏后辈子孙生平小传。</p>

        <div class="person-card">
            <div class="person-name"><a href="zhu-su.html">【始祖】周定王 朱橚 →</a> <span class="person-tag">明太祖第五子</span></div>
            <p style="margin-top: 0.5rem; color: #555;">封吴王，后改封周王就藩开封。博古好学，主持编纂《救荒本草》《普济方》，造福苍生。</p>
        </div>

        <div class="person-card">
            <div class="person-name">周宪王 朱有炖 <span class="person-tag">第二世 · 字辈【有】</span></div>
            <p style="margin-top: 0.5rem; color: #555;">朱橚长子，著名戏曲家、词曲家。号诚斋，著有杂剧三十一种（《诚斋乐府》）。</p>
        </div>

        <div class="person-card">
            <div class="person-name">【支脉先祖 / 近代族人待录入】 <span class="person-tag">支脉传记</span></div>
            <p style="margin-top: 0.5rem; color: #555;">待后世子孙考订家谱后，在此增补各房分支迁徙与家族前辈生平。</p>
        </div>
