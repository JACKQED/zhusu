    <style>
        body { font-family: "PingFang SC", "Microsoft YaHei", serif; margin: 0; padding: 2rem; background: #faf8f5; color: #333; line-height: 1.8; }

        .person-name { font-size: 1.15rem; font-weight: bold; color: #8c1d1d; }
        .person-tag { display: inline-block; background: #efe5dc; color: #6b4d1b; font-size: 0.8rem; padding: 2px 6px; border-radius: 3px; margin-left: 8px; }
        .back-btn { display: inline-block; margin-top: 2rem; padding: 0.4rem 1rem; background: #8c1d1d; color: #fff; border-radius: 4px; text-decoration: none; }

<body>
    <div class="container">
        <h1>后代子孙与名人事迹</h1>
        <p>此栏目用于收录周藩历代宗支后人、迁徙各地的族人小传及近现代家族长辈之生平事迹。</p>

        <div class="person-card">
            <div class="person-name">周宪王 朱有炖 <span class="person-tag">第二世 · 字辈【有】</span></div>
            <p style="margin-top: 0.5rem; font-size: 0.95rem; color: #555;">
                周定王长子，明代著名戏曲家、词曲家。号诚斋，著有杂剧三十一种（如《诚斋乐府》），在元明杂剧过渡时期具有极高的文学史地位。
            </p>
        </div>

        <div class="person-card">
            <div class="person-name">【支系先祖 / 近代族人待录入】 <span class="person-tag">支脉传记</span></div>
            <p style="margin-top: 0.5rem; font-size: 0.95rem; color: #555;">
                可在此处继续添加你的直系祖父辈、迁徙始祖或近现代杰出后人的生平记载。
            </p>
        </div>

        <a href="../index.html" class="back-btn">← 返回首页</a>
